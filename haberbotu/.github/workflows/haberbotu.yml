name: Haberleri Guncelle

on:
  schedule:
    - cron: '0 */6 * * *' 
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v3

      - name: Python Kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Gerekli Kutuphaneleri Yukle
        run: pip install -r requirements.txt

      - name: Haber Botunu Calistir
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python haberbotu.py

      - name: Guncellenen Veritabanini GitHub'a Kaydet
        run: |
          git config --global user.name "Haber Botu"
          git config --global user.email "bot@example.com"
          git add gundem_haberleri.db
          git commit -m "Veritabani yapay zeka ile guncellendi" || echo "Degisiklik yok"
          git push
